<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interviewer</title>
    <link rel="stylesheet" href="{{ url_for('interview_stylesheet') }}">
</head>
<body data-generate-url="{{ url_for('generate_questions') }}">
    <h1>AI Interviewer</h1>
    <p>Voice-enabled interview questions based on the job role, its skill profile, and the candidate's experience.</p>

    <section>
        <h2>Configure Interview</h2>
        <label for="role">Job role</label>
        <input id="role" value="Java Developer">

        <label for="experienceLevel">Candidate experience</label>
        <select id="experienceLevel">
            <option value="fresher" selected>Fresher / no full-time experience</option>
            <option value="experienced">Experienced</option>
        </select>

        <div id="yearsExperienceGroup" hidden>
            <label for="yearsExperience">Years of experience</label>
            <input id="yearsExperience" type="number" min="1" max="50" step="1" value="1">
        </div>

        <label for="skills">Skills listed on the resume (optional, comma-separated)</label>
        <input id="skills" placeholder="For example: Java, SQL, OOP">

        <button id="generateBtn">Generate Questions</button>
        <p id="status" role="status" aria-live="polite">Ready</p>
        <div id="skillsMatch" aria-live="polite" hidden></div>
    </section>

    <section>
        <h2>Interview Progress</h2>
        <p id="questionNumber">Question 0 of 0</p>
        <p id="questionCategory"></p>
        <div class="progress-track">
            <div id="progressFill" class="progress-fill"></div>
        </div>

        <h2>Interview Question</h2>
        <h3 id="questionText">Generate questions to begin.</h3>

        <button id="speakBtn">Speak Question</button>
        <button id="stopSpeakBtn">Stop Speaking</button>
    </section>

    <section>
        <h2>Your Answer</h2>
        <button id="startBtn">Start Microphone</button>
        <button id="stopBtn" disabled>Stop Microphone</button>

        <label for="answer">Recognized answer</label>
        <textarea id="answer" rows="7"
            placeholder="Your spoken answer will appear here..."></textarea>

        <button id="clearBtn">Clear Answer</button>
        <button id="nextBtn" disabled>Next Question</button>
    </section>

    <script>
        const statusText = document.getElementById("status");
        const questionText = document.getElementById("questionText");
        const answer = document.getElementById("answer");
        const generateBtn = document.getElementById("generateBtn");
        const nextBtn = document.getElementById("nextBtn");
        const questionNumberText = document.getElementById("questionNumber");
        const questionCategoryText = document.getElementById("questionCategory");
        const progressFill = document.getElementById("progressFill");
        const startBtn = document.getElementById("startBtn");
        const stopBtn = document.getElementById("stopBtn");
        const generateUrl = document.body.dataset.generateUrl;
        const experienceLevelInput = document.getElementById("experienceLevel");
        const yearsExperienceGroup = document.getElementById("yearsExperienceGroup");
        const yearsExperienceInput = document.getElementById("yearsExperience");
        const skillsMatch = document.getElementById("skillsMatch");

        experienceLevelInput.onchange = () => {
            const experienced = experienceLevelInput.value === "experienced";
            yearsExperienceGroup.hidden = !experienced;
            yearsExperienceInput.required = experienced;
        };

        let questions = [];
        let questionDetails = [];
        let currentIndex = 0;
        let recognition = null;
        let microphoneStream = null;
        let listening = false;
        let finalTranscript = "";

        function pageIsOpenedDirectly() {
            return window.location.protocol === "file:" || !generateUrl.startsWith("/");
        }

        if (pageIsOpenedDirectly()) {
            statusText.textContent =
                "This page was opened as a local file, so it cannot connect to app.py. Start the Flask app with `python Python\\app.py`, then open http://127.0.0.1:5000.";
        }

        function stopQuestionSpeech() {
            if ("speechSynthesis" in window) {
                window.speechSynthesis.cancel();
            }
        }

        function displayQuestion() {
            if (!questions.length) return;

            stopQuestionSpeech();
            const number = currentIndex + 1;
            questionText.textContent = questions[currentIndex];
            questionNumberText.textContent = `Question ${number} of ${questions.length}`;
            const detail = questionDetails[currentIndex];
            questionCategoryText.textContent = detail?.difficulty
                ? `${detail.category} - ${detail.difficulty.name}` +
                    (detail.focus_skill ? ` - Focus: ${detail.focus_skill}` : "")
                : detail?.category || "";
            progressFill.style.width = `${(number / questions.length) * 100}%`;

            answer.value = "";
            finalTranscript = "";
            nextBtn.disabled = currentIndex >= questions.length - 1;
            nextBtn.textContent = currentIndex === questions.length - 1
                ? "Interview Questions Completed"
                : "Next Question";

            // Questions are generated together before the interview starts,
            // so the next question is already available and navigation is instant.
            speakQuestion();
        }

        function clearInterview() {
            questions = [];
            questionDetails = [];
            currentIndex = 0;
            questionText.textContent = "Generate questions to begin.";
            questionNumberText.textContent = "Question 0 of 0";
            questionCategoryText.textContent = "";
            progressFill.style.width = "0%";
            answer.value = "";
            finalTranscript = "";
            nextBtn.disabled = true;
            nextBtn.textContent = "Next Question";
            skillsMatch.hidden = true;
            skillsMatch.replaceChildren();
        }

        function speakQuestion() {
            if (!questions.length) {
                statusText.textContent = "Generate questions first.";
                return;
            }
            if (!("speechSynthesis" in window)) {
                statusText.textContent = "Speech output is unsupported in this browser.";
                return;
            }
            stopQuestionSpeech();
            const utterance = new SpeechSynthesisUtterance(questions[currentIndex]);
            utterance.lang = "en-IN";
            window.speechSynthesis.speak(utterance);
        }

        generateBtn.onclick = async () => {
            if (pageIsOpenedDirectly()) {
                statusText.textContent =
                    "Question generation needs the Flask server. Run `python Python\\app.py` and open http://127.0.0.1:5000.";
                return;
            }

            const role = document.getElementById("role").value.trim();
            const skills = document.getElementById("skills").value
                .split(",").map(skill => skill.trim()).filter(Boolean);
            const experienceLevel = experienceLevelInput.value;
            const yearsExperience = experienceLevel === "experienced"
                ? Number(yearsExperienceInput.value)
                : 0;

            if (!role) {
                statusText.textContent = "Enter a job role.";
                return;
            }
            if (experienceLevel === "experienced" &&
                (!Number.isInteger(yearsExperience) || yearsExperience < 1 || yearsExperience > 50)) {
                statusText.textContent = "Enter whole years of experience from 1 to 50.";
                return;
            }

            if (listening && recognition) recognition.stop();
            stopQuestionSpeech();
            generateBtn.disabled = true;
            nextBtn.disabled = true;
            statusText.textContent =
                "Checking role skills and generating experience-appropriate questions. This may take a few minutes...";
            skillsMatch.hidden = true;
            skillsMatch.replaceChildren();

            try {
                const response = await fetch(generateUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({
                        role,
                        skills,
                        experience_level: experienceLevel,
                        years_experience: yearsExperience
                    })
                });

                const responseText = await response.text();
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch {
                    throw new Error(
                        `The server returned a non-JSON response (HTTP ${response.status}). ` +
                        responseText.slice(0, 180)
                    );
                }

                if (!response.ok) {
                    throw new Error(data.error || `Request failed: HTTP ${response.status}`);
                }
                if (!Array.isArray(data.questions) || data.questions.length !== 25) {
                    throw new Error("The server did not return exactly 25 questions.");
                }
                if (!Array.isArray(data.question_details) ||
                    data.question_details.length !== data.questions.length ||
                    data.question_details.some(detail =>
                        !detail.category ||
                        (["Role and skills", "Project experience"].includes(detail.category) &&
                            !detail.difficulty?.name)
                    )) {
                    throw new Error("The server returned incomplete question categories or difficulty levels.");
                }

                questions = data.questions;
                questionDetails = data.question_details;
                if (data.skill_profile_basis !== "Job title and candidate skills") {
                    const profileTitle = document.createElement("p");
                    profileTitle.textContent =
                        `${data.experience_level === "fresher" ? "Fresher" : "Experienced"} ` +
                        `skill profile for ${data.role || role}: ` +
                        `${data.matched_role_skills.length + data.missing_role_skills.length} skills ` +
                        `(${data.skill_profile_basis}).`;
                    skillsMatch.appendChild(profileTitle);
                    const skillRows = [
                        ["Matched role skills", data.matched_role_skills],
                        [
                            data.experience_level === "fresher"
                                ? "Core skills not listed on the resume"
                                : "Role skills not listed on the resume (still assessed)",
                            data.missing_role_skills
                        ],
                        ["Additional resume skills (asked after role skills)", data.additional_skills]
                    ];
                    skillRows.forEach(([label, skillList]) => {
                        const row = document.createElement("p");
                        row.textContent = skillList.length
                            ? `${label}: ${skillList.join(", ")}`
                            : `${label}: None`;
                        skillsMatch.appendChild(row);
                    });
                    if (Array.isArray(data.skill_sources) && data.skill_sources.length) {
                        const sourceRow = document.createElement("p");
                        sourceRow.append("Sources: ");
                        data.skill_sources.forEach((source, index) => {
                            if (index) sourceRow.append(", ");
                            const sourceLink = document.createElement("a");
                            sourceLink.href = source.url;
                            sourceLink.target = "_blank";
                            sourceLink.rel = "noopener noreferrer";
                            sourceLink.textContent = source.name;
                            sourceRow.appendChild(sourceLink);
                        });
                        skillsMatch.appendChild(sourceRow);
                    }
                    skillsMatch.hidden = false;
                }
                currentIndex = 0;
                displayQuestion();
                const experienceDescription = experienceLevel === "fresher"
                    ? "fresher"
                    : `${yearsExperience} year(s) of experience`;
                statusText.textContent =
                    `25 mixed questions for ${data.role || role} (${experienceDescription}) are ready. Only one question is shown at a time.`;
            } catch (error) {
                clearInterview();
                statusText.textContent = error instanceof TypeError
                    ? "Could not reach the Flask app. Make sure it is running, then reload this page from http://127.0.0.1:5000."
                    : error.message;
                console.error("Question generation error:", error);
            } finally {
                generateBtn.disabled = false;
            }
        };

        document.getElementById("speakBtn").onclick = speakQuestion;
        document.getElementById("stopSpeakBtn").onclick = stopQuestionSpeech;

        function stopMicrophoneTracks() {
            if (microphoneStream) {
                microphoneStream.getTracks().forEach(track => track.stop());
                microphoneStream = null;
            }
        }

        startBtn.onclick = async () => {
            const SpeechRecognition =
                window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                statusText.textContent =
                    "Speech recognition is unavailable. Try a supported browser such as Chrome.";
                return;
            }
            if (!navigator.mediaDevices?.getUserMedia) {
                statusText.textContent =
                    "Microphone access is unavailable in this browser context. Open the app through http://127.0.0.1:5000 or use a secure HTTPS page.";
                return;
            }
            if (listening) return;

            startBtn.disabled = true;
            statusText.textContent = "Requesting microphone access...";
            try {
                microphoneStream = await navigator.mediaDevices.getUserMedia({
                    audio: true
                });

                recognition = new SpeechRecognition();
                recognition.lang = "en-IN";
                recognition.continuous = true;
                recognition.interimResults = true;
                finalTranscript = answer.value.trim();

                recognition.onstart = () => {
                    listening = true;
                    statusText.textContent = "Listening...";
                    stopBtn.disabled = false;
                };

                recognition.onresult = event => {
                    let interim = "";
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            finalTranscript += (finalTranscript ? " " : "") + transcript;
                        } else {
                            interim += transcript;
                        }
                    }
                    answer.value = finalTranscript +
                        (interim ? (finalTranscript ? " " : "") + interim : "");
                };

                recognition.onerror = event => {
                    const messages = {
                        "not-allowed": "Microphone permission was denied. Allow microphone access for this site in your browser settings.",
                        "service-not-allowed": "The browser blocked its speech-recognition service. Allow speech recognition in browser settings.",
                        "audio-capture": "No working microphone was found. Check that a microphone is connected and enabled.",
                        "network": "Microphone access is working, but Chrome's speech-recognition service could not connect. Speech recognition needs an internet connection; reconnect and try again, or type your answer instead.",
                        "no-speech": "No speech was detected. Try again and speak closer to the microphone."
                    };
                    statusText.textContent = messages[event.error] ||
                        `Speech recognition error (${event.error}). You can type your answer instead.`;
                    if (event.error !== "no-speech") {
                        listening = false;
                        startBtn.disabled = false;
                        stopBtn.disabled = true;
                    }
                };

                recognition.onend = () => {
                    listening = false;
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    stopMicrophoneTracks();
                    finalTranscript = answer.value.trim();
                    if (statusText.textContent === "Listening...") {
                        statusText.textContent = "Recording stopped.";
                    }
                };

                recognition.start();
            } catch (error) {
                stopMicrophoneTracks();
                startBtn.disabled = false;
                stopBtn.disabled = true;
                const messages = {
                    NotAllowedError: "Microphone permission was denied. Allow microphone access for this site in your browser settings.",
                    NotFoundError: "No microphone was found. Connect or enable a microphone and try again.",
                    NotReadableError: "The microphone is busy or unavailable. Close other apps using it and try again."
                };
                statusText.textContent = messages[error.name] ||
                    `Could not start microphone: ${error.message}`;
            }
        };

        stopBtn.onclick = () => {
            if (recognition && listening) recognition.stop();
        };

        document.getElementById("clearBtn").onclick = () => {
            if (recognition && listening) recognition.stop();
            else stopMicrophoneTracks();
            answer.value = "";
            finalTranscript = "";
        };

        nextBtn.onclick = () => {
            if (listening) {
                statusText.textContent = "Stop the microphone first.";
                return;
            }
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                displayQuestion();
                statusText.textContent = "Question loaded.";
            }
            if (currentIndex === questions.length - 1) {
                nextBtn.disabled = true;
                nextBtn.textContent = "Interview Questions Completed";
                statusText.textContent = "You have reached the final question.";
            }
        };
    </script>
</body>
</html>
